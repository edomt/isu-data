name: autoupdate

on:
  schedule:
    - cron: "0 10 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run scraper.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          if git diff --quiet data.csv; then
            MSG="keepalive: no data change"
          else
            MSG="ISU: automated update"
          fi
          git add data.csv last_run.txt
          git commit -m "$MSG"
          git push
